name: Code task
description: One change to code or files, limited to a fixed Scope.
labels: [code]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: At most 3 sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Path globs, one per line. A glob must not start with a wildcard.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Commands, one per line.
    validations:
      required: true
  - type: input
    id: budget
    attributes:
      label: Budget
      description: Time budget, for example 2h.
  - type: dropdown
    id: merge
    attributes:
      label: Merge
      description: 'Who merges. human: a human merges. agent: after a passing review, an agent merges with .github/scripts/merge.py. A human always merges a PR that changes a protected path.'
      options:
        - human
        - agent
      default: 0
