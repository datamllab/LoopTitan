name: Run task
description: A set of experiment runs. The results go into one comment.
labels: [run]
body:
  - type: textarea
    id: runs
    attributes:
      label: Runs
      description: 'One command per line, with its config overrides and seed. For options of the Run command, write `<options> -- <cmd>`, for example `--gpus 4 -- python train.py seed=1`.'
    validations:
      required: true
  - type: input
    id: budget
    attributes:
      label: Budget
      description: GPU hours, for example 2.
  - type: input
    id: report
    attributes:
      label: Report
      description: Metric names, separated by spaces.
