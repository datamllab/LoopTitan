name: Study
description: 'One research question, answered by code and run sub-issues. Arms, Controlled and Adaptable are the spec that each run is checked against.'
labels: [study]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: The question that this study answers.
    validations:
      required: true
  - type: textarea
    id: arms
    attributes:
      label: Arms
      description: 'One arm per line: `<arm>: <key>=<value> [<key>=<value> ...]`. Write only the settings in which the arms differ, for example `lora: model.adapter=lora model.lora.rank=8`. A key is a dotted key of the run config (config.json). A key can be in only one of Arms, Controlled and Adaptable. A value that parses as JSON (a number, true/false/null, a list) compares as JSON; other values compare as strings. A line can end with `  # <comment>`.'
    validations:
      required: true
  - type: textarea
    id: controlled
    attributes:
      label: Controlled
      description: 'One setting per line that all runs must meet, with a reason (a paper, a record or an earlier result). `<key>=<value>  # <reason>` means that every run uses this value. `<key> in <v1>,<v2>,...  # <reason>` means that every arm runs all these values, for example seeds and tuning grids. Write each usual confounder that applies: data and split, preprocessing and augmentation, model and initialization, optimizer and schedule, effective batch and training length, precision, tuning budget, evaluation protocol and checkpoint selection, seed. For example `train.effective_batch=256  # paper X, table 2` and `seed in 1,2,3  # paper X uses 3 seeds`.'
    validations:
      required: true
  - type: textarea
    id: adaptable
    attributes:
      label: Adaptable
      description: 'Optional. Engineering settings that can differ between runs and that can change during execution by a rule, one per line: `<key>  # <rule>`, for example `train.per_device_batch  # set by GPU memory; the effective batch is fixed in Controlled`.'
  - type: textarea
    id: criteria
    attributes:
      label: Criteria
      description: Which result answers the question.
    validations:
      required: true
  - type: input
    id: budget
    attributes:
      label: Budget
      description: GPU hours and time, for example 4 GPU hours, 1 day.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to related studies, results comments and papers.
