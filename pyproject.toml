[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moeloop-lab"
version = "1.0.0rc1"
description = "Readable recursive sparse models, TorchTitan training, and portable model delivery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mixture-of-experts", "looped-transformer", "recursive-depth", "torchtitan", "pytorch"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://datamllab.github.io/LoopTitan/"
Documentation = "https://datamllab.github.io/LoopTitan/docs/"
Repository = "https://github.com/datamllab/LoopTitan"

[project.optional-dependencies]
model = ["torch==2.14.0"]
data = ["torch==2.14.0", "tokenizers==0.23.3", "datasets>=3.6.0,<4.8.0", "torchdata==0.11.0"]
hf = ["torch==2.14.0", "transformers==5.20.2", "tokenizers==0.23.3", "safetensors==0.8.0"]
eval = ["torch==2.14.0", "transformers==5.20.2", "tokenizers==0.23.3", "safetensors==0.8.0", "lm_eval[hf]==0.4.13"]
train = ["torch==2.14.0", "torchtitan==0.3.0"]

report = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pyyaml==6.0.2",
  "mlflow-skinny==3.17.1",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["moeloop", "moeloop_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests/scripts"]
