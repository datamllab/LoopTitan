[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moeloop-lab"
version = "1.0.0rc1"
description = "Open PyTorch infrastructure for looped mixture-of-experts (MoE) language models: one model for the published designs, budget-matched comparison, TorchTitan training and Hugging Face export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "looped MoE", "mixture-of-experts", "MoE", "looped transformer", "looped language model", "parameter sharing",
  "recurrent depth", "latent reasoning", "large language models", "pretraining", "Muon", "AdamW",
  "compute-matched comparison", "PyTorch", "TorchTitan", "Hugging Face",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://datamllab.github.io/LoopTitan/"
Documentation = "https://datamllab.github.io/LoopTitan/docs/"
Repository = "https://github.com/datamllab/LoopTitan"
Paper = "https://arxiv.org/abs/2611.34821"
Models = "https://huggingface.co/NaturalScale"

[project.optional-dependencies]
model = ["torch==2.14.0"]
data = ["torch==2.14.0", "tokenizers==0.23.3", "datasets>=3.6.0,<4.8.0", "torchdata==0.11.0"]
hf = ["torch==2.14.0", "transformers==5.20.2", "tokenizers==0.23.3", "safetensors==0.8.0"]
eval = ["torch==2.14.0", "transformers==5.20.2", "tokenizers==0.23.3", "safetensors==0.8.0", "lm_eval[hf]==0.4.13"]
train = ["torch==2.14.0", "torchtitan==0.3.0"]

report = ["matplotlib>=3.10,<4"]

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pyyaml==6.0.2",
  "mlflow-skinny==3.17.1",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["moeloop", "moeloop_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests/scripts"]
