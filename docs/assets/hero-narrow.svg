<svg xmlns="http://www.w3.org/2000/svg" width="360" height="252" viewBox="0 0 360 252" role="img" aria-labelledby="title desc">
<title id="title">The Phase 1 loop</title>
<desc id="desc">3 outer layers, 6 middle layers that run 2 times with one set of weights, 3 outer layers: 12 layers stored, 18 run. A light passes the middle layers twice.</desc>
