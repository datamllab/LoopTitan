<svg xmlns="http://www.w3.org/2000/svg" width="360" height="502" viewBox="0 0 360 502" role="img" aria-labelledby="title desc">
<title id="title">How research runs here</title>
<desc id="desc">How research runs here. A study: declare, run, check against the declaration, record. An outside entry: a submission folder, the bench workflow's check, merge. Both end in the record, where failed runs and refuted predictions stay.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}:root{--ink:#16181D;--mid:#5B616E;--softt:#737985;--soft:#9AA0AB;--hair:#D5D8DE;--line:#E3E5E9;--faint:#ECEEF1;--band:#EEF0F3;--card:#FFFFFF;--panel:#FFFFFF;--acc:#3346D3;--acc2:#7C89E4;--acc3:#AAB3F0;--tint:#F2F4FD;--tint2:#E6E9FB;--bar:#16181D;--grey:#9AA0AB;--on_acc:#FFFFFF;--glow:#3346D3;--spark:#FFFFFF;--lit:#AAB3F0}@media (prefers-color-scheme: dark){:root{--ink:#E7EBF1;--mid:#9BA3AF;--softt:#848B97;--soft:#5E6672;--hair:#363D48;--line:#272D36;--faint:#1B2028;--band:#1B2028;--card:#0D1117;--panel:#0D1117;--acc:#7486F2;--acc2:#5866C9;--acc3:#3B458B;--tint:#151A2E;--tint2:#1D2442;--bar:#DCE0E7;--grey:#6B7280;--on_acc:#0D1117;--glow:#8E9CF7;--spark:#FFFFFF;--lit:#B9C2FB}}</style>
<path d="M2.5 52L2.5 446" style="fill:none;stroke:var(--hair);stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><text class="m" x="26" y="22" text-anchor="start" style="font-size:11px;font-weight:500;fill:var(--mid);letter-spacing:0.66px">A STUDY</text><rect x="2" y="50" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="m" x="26" y="56.5" text-anchor="start" style="font-size:12px;font-weight:400;fill:var(--softt)">1</text><text class="s" x="46" y="57" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">Declare</text><text class="s" x="46" y="77" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">arms and budget</text><rect x="2" y="108" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="m" x="26" y="114.5" text-anchor="start" style="font-size:12px;font-weight:400;fill:var(--softt)">2</text><text class="s" x="46" y="115" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">Run</text><text class="s" x="46" y="135" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">each run recorded</text><rect x="2" y="166" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="m" x="26" y="172.5" text-anchor="start" style="font-size:12px;font-weight:400;fill:var(--softt)">3</text><text class="s" x="46" y="173" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">Check</text><text class="s" x="46" y="193" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">against the design</text><text class="m" x="26" y="234" text-anchor="start" style="font-size:11px;font-weight:500;fill:var(--mid);letter-spacing:0.66px">AN OUTSIDE ENTRY</text><rect x="2" y="262" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="m" x="26" y="268.5" text-anchor="start" style="font-size:12px;font-weight:400;fill:var(--softt)">1</text><text class="s" x="46" y="269" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">Submit</text><text class="s" x="46" y="289" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">a result folder</text><rect x="2" y="320" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="m" x="26" y="326.5" text-anchor="start" style="font-size:12px;font-weight:400;fill:var(--softt)">2</text><text class="s" x="46" y="327" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">Check</text><text class="s" x="46" y="347" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">the bench workflow</text><rect x="2" y="378" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="m" x="26" y="384.5" text-anchor="start" style="font-size:12px;font-weight:400;fill:var(--softt)">3</text><text class="s" x="46" y="385" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">Merge</text><text class="s" x="46" y="405" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">complete records</text><rect x="2" y="444" width="14" height="4" rx="1" style="fill:var(--ink)"/><text class="s" x="26" y="451" text-anchor="start" style="font-size:15px;font-weight:600;fill:var(--ink)">The record</text><text class="s" x="26" y="471" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">Issues, runs and results. Failed runs and refuted</text><text class="s" x="26" y="489" text-anchor="start" style="font-size:13px;font-weight:400;fill:var(--mid)">predictions stay.</text>
</svg>
