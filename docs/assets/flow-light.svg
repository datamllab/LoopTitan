<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" role="img" aria-labelledby="title desc">
<title id="title">How research runs here</title>
<desc id="desc">How research runs here. A study: declare, run, check against the declaration, record. An outside entry: a submission folder, the bench workflow's check, merge. Both end in the record, where failed runs and refuted predictions stay.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
<text class="m" x="0" y="20" text-anchor="start" style="font-size:11px;font-weight:500;fill:#5B616E;letter-spacing:0.66px">A STUDY</text><path d="M0 58.5L636 58.5" style="fill:none;stroke:#D5D8DE;stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><rect x="0" y="42" width="4" height="16" rx="1" style="fill:#16181D"/><text class="m" x="12" y="53" text-anchor="start" style="font-size:12px;font-weight:400;fill:#737985">1</text><text class="s" x="0" y="86" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">Declare</text><text class="s" x="0" y="106" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">arms and budget</text><rect x="196" y="42" width="4" height="16" rx="1" style="fill:#16181D"/><text class="m" x="208" y="53" text-anchor="start" style="font-size:12px;font-weight:400;fill:#737985">2</text><text class="s" x="196" y="86" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">Run</text><text class="s" x="196" y="106" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">each run recorded</text><rect x="392" y="42" width="4" height="16" rx="1" style="fill:#16181D"/><text class="m" x="404" y="53" text-anchor="start" style="font-size:12px;font-weight:400;fill:#737985">3</text><text class="s" x="392" y="86" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">Check</text><text class="s" x="392" y="106" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">against the design</text><text class="m" x="0" y="152" text-anchor="start" style="font-size:11px;font-weight:500;fill:#5B616E;letter-spacing:0.66px">AN OUTSIDE ENTRY</text><path d="M0 190.5L636 190.5" style="fill:none;stroke:#D5D8DE;stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><rect x="0" y="174" width="4" height="16" rx="1" style="fill:#16181D"/><text class="m" x="12" y="185" text-anchor="start" style="font-size:12px;font-weight:400;fill:#737985">1</text><text class="s" x="0" y="218" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">Submit</text><text class="s" x="0" y="238" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">a result folder</text><rect x="196" y="174" width="4" height="16" rx="1" style="fill:#16181D"/><text class="m" x="208" y="185" text-anchor="start" style="font-size:12px;font-weight:400;fill:#737985">2</text><text class="s" x="196" y="218" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">Check</text><text class="s" x="196" y="238" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">the bench workflow</text><rect x="392" y="174" width="4" height="16" rx="1" style="fill:#16181D"/><text class="m" x="404" y="185" text-anchor="start" style="font-size:12px;font-weight:400;fill:#737985">3</text><text class="s" x="392" y="218" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">Merge</text><text class="s" x="392" y="238" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">complete records</text><rect x="636" y="42" width="4" height="149" rx="1" style="fill:#16181D"/><text class="s" x="660" y="100" text-anchor="start" style="font-size:15px;font-weight:600;fill:#16181D">The record</text><text class="s" x="660" y="124" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">Issues, runs and results.</text><text class="s" x="660" y="143" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">Failed runs and refuted</text><text class="s" x="660" y="162" text-anchor="start" style="font-size:13px;font-weight:400;fill:#5B616E">predictions stay.</text>
</svg>
