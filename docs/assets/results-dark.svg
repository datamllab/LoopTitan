<svg xmlns="http://www.w3.org/2000/svg" width="880" height="426" viewBox="0 0 880 426" role="img" aria-labelledby="title desc">
<title id="title">Phase 1: one change at a time</title>
<desc id="desc">A waterfall of the one-change chain under AdamW and Muon, test mBPB against the ordinary MoE: Ordinary MoE: AdamW +0.0, Muon +0.0; Finer experts: AdamW -4.2, Muon -0.9; Deeper, narrower: AdamW -6.9, Muon -4.2; Expert layout: AdamW -5.9, Muon -3.4; Residual scale: AdamW -8.9, Muon -3.3; The loop: AdamW -9.0, Muon -3.7.</desc>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}</style>
